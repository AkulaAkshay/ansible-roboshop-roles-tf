- name: include vs import
  hosts: local
  connection: local
  become: yes
  roles:
  - include-import

#include rolevs import role
#include role --> The roles which we are extracting (i.e., catalogue, common,..) those are included at runtime. It includes roles at runtime, checks while processing. (include is at runtime --> it firstly starts the execution then after if encoounters error it  will stop) 
#import role --> The roles which we are extracting those are included before execution. It imports the role before execution and parse it, checks before processing (import before runtime ie., it is static --> it cheks the whole playbook, if everything is fine only then it execute). Applying tags at the import, will setup to all the tasks automatically

