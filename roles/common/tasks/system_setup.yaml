# systemd (daemon reload) should run only when we have a change in .service file (in "/etc/systemd/system/{{ component }}.service" )
# - name: daemon reload 
#   ansible.builtin.systemd_service:
#     daemon_reload: true

# so we use handlers/notifiers
#what are handlers/notifiers? -> (notify --> keyword) handlers are like notifiers, when there is a change in a particular task then we can notify the another task and then it should trigger, if there is no change then no need of notifying to another system and then it shouldn't be triggering it . Its an inbuilt feature that ansible provides(think like yellow colour- change; green- success but no change; red- fail in mobaxterm UI)


- name: copy {{ component }} service
  ansible.builtin.template: #instead of ansible.nuiltin.copy: --> we need to use ansible.builtin.template: --> because we are saying that catalogue.service.j2 is an template
    src: "{{ component }}.service.j2"
    dest: "/etc/systemd/system/{{ component }}.service" # ansible compares not only the file changes it also compares the content changes ( .service file chnages then notify executes and if we have made changes  in the .service file even then the notify will be executed. --> same as git even if we write #comments even then notify will be executed)
  notify: daemon reload

- name: start the service
  ansible.builtin.service:
    name: "{{ component }}"
    state: restarted
    enabled: yes

    #instead of ansible.nuiltin.copy: --> we need to use ansible.builtin.template: