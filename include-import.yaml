#include will not respect tags --> even if we provides tags it treats like no tags ever existed ( -t deployment --> if we run this, then this will be skipped, will not be executed)
#include will not respect tags, we must explicitly set inside the tasks 
- name: install dependencies
  community.general.npm:
    path: /app
  tags:
  - deploy


